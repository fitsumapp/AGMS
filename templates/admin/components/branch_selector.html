{% if branch_options or all_branches_allowed %}<form action="{% url 'switch-branch' %}" method="post" class="erp-branch-selector" aria-label="Active branch">
  {% csrf_token %}
  <label for="active-branch" class="erp-branch-label">Branch</label>
  <select id="active-branch" name="branch" aria-label="Active branch">
    {% if all_branches_allowed %}<option value="all" {% if not selected_branch %}selected{% endif %}>All Branches</option>{% endif %}
    {% for branch in branch_options %}<option value="{{ branch.pk }}" {% if selected_branch.pk == branch.pk %}selected{% endif %}>{{ branch.name }}</option>{% endfor %}
  </select>
  <button type="submit">Switch</button>
</form>{% else %}<span class="erp-context">No branch assigned</span>{% endif %}

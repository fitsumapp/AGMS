<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Member ID Badge — {{ member.member_number }}</title>
  <style>
    @page {
      size: 85.6mm 53.98mm; /* Standard ID-1 Credit Card Size */
      margin: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .badge-card {
      width: 324px;
      height: 204px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .badge-header {
      background: #0f766e;
      color: white;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-header h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-header span {
      font-size: 10px;
      opacity: 0.9;
    }
    .badge-body {
      padding: 12px 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex: 1;
    }
    .badge-qr img {
      width: 105px;
      height: 105px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }
    .badge-info {
      flex: 1;
    }
    .badge-name {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px 0;
    }
    .badge-number {
      font-size: 11px;
      color: #0f766e;
      font-weight: 600;
      margin: 0 0 6px 0;
    }
    .badge-detail {
      font-size: 9px;
      color: #64748b;
      margin: 2px 0;
    }
    .badge-detail strong {
      color: #334155;
    }
    .print-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    @media print {
      body {
        background: transparent;
      }
      .print-btn {
        display: none;
      }
      .badge-card {
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">Print ID Badge</button>

  <div class="badge-card">
    <div class="badge-header">
      <h1>AGMS GYM PASS</h1>
      <span>{{ member.home_branch.code }}</span>
    </div>
    <div class="badge-body">
      <div class="badge-qr">
        <img src="{{ qr_uri }}" alt="Member QR Code">
      </div>
      <div class="badge-info">
        <div class="badge-name">{{ member.full_name }}</div>
        <div class="badge-number">{{ member.member_number }}</div>
        <div class="badge-detail">Branch: <strong>{{ member.home_branch.name }}</strong></div>
        <div class="badge-detail">Issued: <strong>{{ credential.issued_date|date:"Y-m-d" }}</strong></div>
        <div class="badge-detail">Status: <strong>{{ credential.status }}</strong></div>
      </div>
    </div>
  </div>
</body>
</html>
